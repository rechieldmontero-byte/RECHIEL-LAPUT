<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - Scholarship Monitoring System</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="auth-card">
    <h1>Create Scholar Account</h1>
    <p>Register to submit your semester academic summary.</p>
    <form id="registerForm">
      <label for="fullName">Full name</label>
      <input id="fullName" required maxlength="100" autocomplete="name">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email">
      <label for="password">Password</label>
      <input id="password" type="password" minlength="8" required autocomplete="new-password">
      <button type="submit">Create Account</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
    <p><a href="index.html">Back to Sign in</a></p>
  </main>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
