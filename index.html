<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Scholarship Monitoring System</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="auth-card">
    <p class="eyebrow">SCHOLARSHIP OFFICE</p>
    <h1>Sign in</h1>
    <p>Access your scholarship account and manage academic submissions.</p>

    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email" placeholder="name@example.com">

      <label for="password">Password</label>
      <input id="password" type="password" required autocomplete="current-password" placeholder="Enter your password">

      <button type="submit">Login</button>
      <p id="loginMessage" role="status" aria-live="polite"></p>
    </form>

    <p><a href="register.html">Create an account</a></p>
  </main>

  <script src="supabase.js"></script>
  <script src="login.js"></script>
</body>
</html>
